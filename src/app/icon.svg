<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101b"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Ambient Glow in core -->
  <circle cx="32" cy="32" r="14" fill="#14b8a6" opacity="0.25" filter="url(#softGlow)"/>

  <!-- Monogram T Bar -->
  <rect x="13" y="14" width="38" height="7.5" rx="3.75" fill="url(#brandGrad)"/>

  <!-- Monogram T Stem -->
  <rect x="28.25" y="20" width="7.5" height="29" rx="3.75" fill="url(#brandGrad)"/>

  <!-- Flutter-style dynamic accent wing (Bottom-Right) -->
  <path d="M 37.5 35.5 L 48.5 24.5 C 49.3 23.7 50.7 24.3 50.7 25.4 L 50.7 31 C 50.7 31.6 50.4 32.2 49.9 32.7 L 41.5 41.1 C 40.7 41.9 39.3 41.3 39.3 40.2 L 39.3 37 C 39.3 36.4 38.8 35.5 37.5 35.5 Z" fill="url(#accentGrad)" opacity="0.95"/>

  <!-- Tech status node -->
  <circle cx="49" cy="45" r="3" fill="#34d399"/>
</svg>
